<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigitShowWebview</title>
  <!-- Bootstrap (optional) -->
  <link href="./bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <meta name="referrer" content="no-referrer-when-downgrade"/>
<style>
/* =======   Fallback styles (also used when Bootstrap present)  ======= */
:root{
  /* default background (overridden by JSON system.color) */
  --bg-color:#002020;
}
body{
  background-color:var(--bg-color);
  color:#ffffff;
  font-family:Arial,Helvetica,sans-serif;
}
.card{
  background-color: rgb(0, 0, 0, 0.0);
  border:1px solid rgb(255, 255, 255, 0.4);
  border-radius:0.5rem;
}
.card-header{
  font-weight:bold;
}
.data-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:4px;
}
.data-item{
  border:1px solid rgb(255, 255, 255, 0.4);
  border-radius:4px;
  padding:4px;
}
.data-item-label{
  font-size:0.75rem;
}
.data-item-value{
  font-size:1.2rem;
  font-weight:bold;
  text-align:right;
}
/* --- Charts (fallback) --- */
img.img-fluid { max-width: 100%; height: auto; display: block; }
#charts-card img { background: rgba(255,255,255,0.03); }
</style>
</head>
<body>
  <div class="container-fluid py-2">
    <h1 class="h4 text-center mb-2">DigiShowModbus Web Monitor</h1>
    
    <!-- IP Address Selection -->
    <div class="card mb-3 text-light">
      <div class="card-header py-1">Connection Settings</div>
      <div class="card-body p-2">
        <div class="row g-2 align-items-end">
          <div class="col-md-8">
            <label for="ip-input" class="form-label small">Target IP Address:</label>
            <input type="text" id="ip-input" class="form-control form-control-sm" 
                   placeholder="192.168.1.100" value="localhost">
          </div>
          <div class="col-md-4">
            <button id="connect-btn" class="btn btn-primary btn-sm w-100">Connect</button>
          </div>
        </div>
        <div class="mt-2">
          <small class="text-muted">Recent IPs: </small>
          <div id="recent-ips" class="d-inline"></div>
        </div>
      </div>
    </div>
    
    <!-- All dynamically generated groups live here -->
    <div id="groups"></div>
    <!-- Charts (Server-side rendered images) -->
    <div class="card mb-2 text-light" id="charts-card" aria-labelledby="charts-title">
      <div class="card-header py-1" id="charts-title">Charts</div>
      <div class="card-body p-2">
        <div class="row g-2">
          <div class="col-12 col-md-6">
            <img id="chart-a" class="img-fluid rounded border"
                src="" alt="Chart A" loading="lazy">
          </div>
          <div class="col-12 col-md-6">
            <img id="chart-b" class="img-fluid rounded border"
                src="" alt="Chart B" loading="lazy">
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * DigiShowModbus simple polling front-end
 * – fetches JSON from configurable IP endpoint every cycle
 * – supports IP selection with cookie persistence
 * – waits for the previous request to complete successfully before firing the next
 * – generous timeout (4 s) in case of the 500 ms network/processing latency
 */

const TIMEOUT_MS = 4000;   // must be > 500 ms round-trip
const COOKIE_NAME = 'digitshow_ip';
const COOKIE_DAYS = 21;    // 3 weeks persistence
let currentIP = 'localhost';
let initialised = false;
let isPolling = false;

// ──────────────────────────────────────────────────────────────
//  Cookie Management
// ──────────────────────────────────────────────────────────────
function setCookie(name, value, days) {
  const expires = new Date();
  expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
  document.cookie = `${name}=${value};expires=${expires.toUTCString()};path=/`;
}

function getCookie(name) {
  const nameEQ = name + "=";
  const ca = document.cookie.split(';');
  for (let i = 0; i < ca.length; i++) {
    let c = ca[i];
    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
  }
  return null;
}

function saveRecentIP(ip) {
  if (!ip || ip === 'localhost') return;
  
  let recentIPs = JSON.parse(getCookie('digitshow_recent_ips') || '[]');
  // Remove if already exists and add to front
  recentIPs = recentIPs.filter(item => item !== ip);
  recentIPs.unshift(ip);
  // Keep only last 5 IPs
  recentIPs = recentIPs.slice(0, 5);
  
  setCookie('digitshow_recent_ips', JSON.stringify(recentIPs), COOKIE_DAYS);
  updateRecentIPsUI();
}

function getRecentIPs() {
  return JSON.parse(getCookie('digitshow_recent_ips') || '[]');
}

function updateRecentIPsUI() {
  const container = document.getElementById('recent-ips');
  const recentIPs = getRecentIPs();
  
  container.innerHTML = '';
  recentIPs.forEach(ip => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-outline-light btn-sm me-1 mb-1';
    btn.style.fontSize = '0.75rem';
    btn.textContent = ip;
    btn.onclick = () => {
      document.getElementById('ip-input').value = ip;
      connectToIP();
    };
    container.appendChild(btn);
  });
}

// ──────────────────────────────────────────────────────────────
//  Connection Management
// ──────────────────────────────────────────────────────────────
function getEndpointURL() {
  if (currentIP === 'localhost' || currentIP === '127.0.0.1') {
    return '/v1/';
  }
  // Force HTTP for external devices (they don't support HTTPS)
  return `http://${currentIP}/v1/`;
}

function getChartURL(chartName) {
  const ts = Date.now();
  if (currentIP === 'localhost' || currentIP === '127.0.0.1') {
    return `/v1/img/${chartName}?ts=${ts}`;
  }
  // Force HTTP for external devices (they don't support HTTPS)
  return `http://${currentIP}/v1/img/${chartName}?ts=${ts}`;
}

function connectToIP() {
  const input = document.getElementById('ip-input');
  const newIP = input.value.trim();
  
  if (!newIP) {
    alert('Please enter an IP address');
    return;
  }
  
  // Stop current polling
  isPolling = false;
  
  // Update current IP
  currentIP = newIP;
  
  // Save to cookies
  setCookie(COOKIE_NAME, currentIP, COOKIE_DAYS);
  saveRecentIP(currentIP);
  
  // Reset UI state
  initialised = false;
  document.getElementById('groups').innerHTML = '';
  
  // Update connection button state
  const btn = document.getElementById('connect-btn');
  btn.textContent = 'Connecting...';
  btn.disabled = true;
  
  // Start polling with new IP
  setTimeout(() => {
    isPolling = true;
    poll();
  }, 500);
}

// ──────────────────────────────────────────────────────────────
//  Initialization
// ──────────────────────────────────────────────────────────────
function initializeApp() {
  // Load saved IP from cookie
  const savedIP = getCookie(COOKIE_NAME);
  if (savedIP) {
    currentIP = savedIP;
    document.getElementById('ip-input').value = savedIP;
  }
  
  // Setup event listeners
  document.getElementById('connect-btn').onclick = connectToIP;
  document.getElementById('ip-input').onkeypress = (e) => {
    if (e.key === 'Enter') connectToIP();
  };
  
  // Update recent IPs UI
  updateRecentIPsUI();
  
  // Auto-connect
  connectToIP();
}

// ──────────────────────────────────────────────────────────────
//  Helpers
// ──────────────────────────────────────────────────────────────
function fetchWithTimeout (url, timeout = TIMEOUT_MS) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  
  // Configure fetch options to handle CORS and mixed content issues
  const fetchOptions = {
    signal: controller.signal,
    mode: 'cors',
    credentials: 'omit',
    referrerPolicy: 'strict-origin-when-cross-origin',
    headers: {
      'Accept': 'application/json',
    }
  };
  
  return fetch(url, fetchOptions)
    .catch(error => {
      // If CORS fails, try with no-cors mode as fallback
      if (error.name === 'TypeError' && error.message.includes('CORS')) {
        console.warn('CORS failed, trying no-cors mode for:', url);
        const fallbackOptions = {
          ...fetchOptions,
          mode: 'no-cors'
        };
        return fetch(url, fallbackOptions);
      }
      throw error;
    })
    .finally(() => clearTimeout(id));
}

/**
 * Apply background color from data.system.color or fallback
 */
function applySystemColor (data) {
  const color = data?.system?.color || '#002020';
  document.documentElement.style.setProperty('--bg-color', color);
}

/**
 * Value formatting rules
 *  - "raw"  : integer (no decimals)
 *  - others : fixed 5‑decimal float
 */
function formatValue (key, v) {
  if (typeof v !== "number") return v;
  return key === "raw" ? v.toFixed(0) : v.toFixed(5);
}

// ──────────────────────────────────────────────────────────────
//  UI builders
// ──────────────────────────────────────────────────────────────
function createGroup (title, key, entries) {
  const card   = document.createElement("div");
  card.className = "card mb-2 text-light";

  const header = document.createElement("div");
  header.className = "card-header py-1";
  header.textContent = title;

  const body   = document.createElement("div");
  body.className = "card-body p-2";

  const grid   = document.createElement("div");
  grid.className = "data-grid";

  entries.forEach(([id, label, value]) => {
    const item = document.createElement("div");
    item.className = "data-item";
    item.innerHTML = `<div class=\"data-item-label\">${label}</div><div id=\"${key}-${id}\" class=\"data-item-value\">${formatValue(key,value)}</div>`;
    grid.appendChild(item);
  });

  body.appendChild(grid);
  card.appendChild(header);
  card.appendChild(body);
  return card;
}

function buildUI (data) {
  const container = document.getElementById("groups");
  container.innerHTML = "";

  const categories = [
    { key: "raw",    title: "Raw Value (int16_t −32768 to +32767)" },
    { key: "phy",    title: "Physical Value" },
    { key: "param",  title: "Parameter" },
    { key: "output", title: "Voltage Output" }
  ];

  categories.forEach(cat => {
    if (!data[cat.key]) return;
    const entries = Object.entries(data[cat.key])
          .sort(([a],[b]) => Number(a) - Number(b))        // numeric sort ensures 00 first
          .map(([id, obj]) => [id.padStart(2, "0"), obj.label || id, obj.value]);
    container.appendChild(createGroup(cat.title, cat.key, entries));
  });
}

function updateValues (data) {
  ["raw", "phy", "param", "output"].forEach(key => {
    if (!data[key]) return;
    Object.entries(data[key]).forEach(([id, obj]) => {
      const el = document.getElementById(`${key}-${id.padStart(2, "0")}`);
      if (el) el.textContent = formatValue(key, obj.value);
    });
  });
}

// ──────────────────────────────────────────────────────────────
// Charts: image refresh helpers
// ──────────────────────────────────────────────────────────────

// キャッシュを避けるためにクエリでタイムスタンプを付与
function refreshCharts() {
  const a = document.getElementById('chart-a');
  const b = document.getElementById('chart-b');
  if (!a || !b) return; // カードを置いていないページでも安全に

  a.src = getChartURL('chart_a');
  b.src = getChartURL('chart_b');
}

// 失敗時は見た目を落として分かるように（成功したら戻す）
function bindImgLoadHandlers(id, label) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('error', () => {
    el.classList.add('opacity-50');
    el.alt = `${label} (load failed)`;
  });
  el.addEventListener('load', () => {
    el.classList.remove('opacity-50');
  });
}
bindImgLoadHandlers('chart-a', 'Chart A');
bindImgLoadHandlers('chart-b', 'Chart B');

// 画像は全サイクルで更新すると重いので、n回に1度だけ更新
let chartTick = 0;
const CHART_REFRESH_EVERY = 5; // 5サイクル ≒ 約5–6秒ごとに更新（負荷と鮮度のバランス）

// 既存の poll() の最後（finally節）や成功処理の末尾に以下を追加
// 例：poll() の try{...}finally{ setTimeout(poll, 200); } の try 部分の末尾など
// 「成功時にだけ更新したい」なら success ルートで ++chartTick する形でもOK
function maybeRefreshCharts() {
  chartTick++;
  if (chartTick % CHART_REFRESH_EVERY === 0) {
    refreshCharts();
  }
}

// ──────────────────────────────────────────────────────────────
//  Polling loop
// ──────────────────────────────────────────────────────────────
async function poll () {
  if (!isPolling) return; // Stop polling if disabled
  
  try {
    const res = await fetchWithTimeout(getEndpointURL());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();

    // Update connection button state on success
    const btn = document.getElementById('connect-btn');
    btn.textContent = 'Connected';
    btn.disabled = false;
    btn.className = 'btn btn-success btn-sm w-100';

    // system color update
    applySystemColor(data);

    if (!initialised) {
      buildUI(data);
      initialised = true;
    } else {
      updateValues(data);
    }
  } catch (err) {
    console.error("Fetch error:", err);
    
    // Update connection button state on error
    const btn = document.getElementById('connect-btn');
    btn.textContent = 'Connection Failed';
    btn.disabled = false;
    btn.className = 'btn btn-danger btn-sm w-100';
  } finally {
    // ← ここで画像更新の判定を呼ぶ
    if (isPolling) {
      maybeRefreshCharts();
      // queue the next attempt *after* this one completes, avoiding request piling
      setTimeout(poll, 200);   // 600 ms gap keeps total cycle time ≥ ~1.1 s
    }
  }
}

// kick-off when DOM is ready
document.addEventListener('DOMContentLoaded', initializeApp);
</script>
</body>
</html>
