name: Release static www.zip

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static assets
        run: bun run build

      - name: Create www.zip
        run: |
          rm -rf www www.zip
          mkdir -p www
          cp -R dist/. www/
          cd www
          zip -r ../www.zip .

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: www.zip
          fail_on_unmatched_files: true
